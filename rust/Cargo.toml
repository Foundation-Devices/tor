[package]
name = "tor_ffi_plugin"
version = "0.1.0"
authors = ["Igor Cota <igor@foundationdevices.com>"]
edition = "2021"

[lib]
name = "tor_ffi_plugin"
crate-type = ["cdylib", "staticlib"]

# Keep the exported C ABI intact in release dylibs. In particular, stripping
# the macOS cdylib can make the packaged native asset fail to load.
[profile.release]
strip = "none"

[dependencies]
lazy_static = "1.4"
tokio = { version = "1", features = ["full"] }
arti-client = { version = "0.47.0", features = ["static", "onion-service-client"] }
arti = { version = "2.7.0", features = ["experimental-api", "static"] }
tor-rtcompat = { version = "0.47.0", features = ["static", "native-tls", "tokio"] }
tor-config = "=0.47.0"
log = "0.4.20"
lzma-sys = { version = "0.1.20", features = ["static"] }
#android_log-sys = "0.3.1"
rlimit = "0.10.1"
anyhow = "1.0.79"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
# Specific version for iOS
security-framework = "=2.10.0"

[build-dependencies]
cbindgen = "= 0.24.3"
glob = "0.3.1"

[dev-dependencies]
saturating-time = "0.5.0"

# saturating-time 0.5.0 (via tor-netdoc) never finishes computing the minimum
# SystemTime on Windows, which hangs consensus parsing and therefore bootstrap.
# The vendored copy guards `find_limit` against steps below the platform's
# clock resolution and tests the same rounding behavior on every platform.
[patch.crates-io]
saturating-time = { path = "patches/saturating-time" }
