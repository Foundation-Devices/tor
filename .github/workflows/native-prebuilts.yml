name: Native and package validation

on:
  pull_request:
  push:
    tags: ['native-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-prebuilts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Rust, Dart, and lifecycle tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev liblzma-dev ninja-build pkg-config perl
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Verify Rust
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --locked --all-targets --manifest-path rust/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - name: Verify Dart and native lifecycle
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust
          ignore: RUSTSEC-2021-0145,RUSTSEC-2023-0071

  build:
    if: github.event.deleted != true
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {target: x86_64-pc-windows-msvc, runner: windows-2022}
          - {target: aarch64-apple-darwin, runner: macos-15}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: aarch64-apple-ios, runner: macos-15}
          - {target: aarch64-apple-ios-sim, runner: macos-15}
          - {target: x86_64-apple-ios, runner: macos-15-intel}
          - {target: armv7-linux-androideabi, runner: ubuntu-22.04}
          - {target: aarch64-linux-android, runner: ubuntu-22.04}
          - {target: x86_64-linux-android, runner: ubuntu-22.04}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Use short Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force C:\c, C:\t, C:\tmp | Out-Null
          "CARGO_HOME=C:/c" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=C:/t" >> $env:GITHUB_ENV
          "TEMP=C:\tmp" >> $env:GITHUB_ENV
          "TMP=C:\tmp" >> $env:GITHUB_ENV
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl
      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$NATIVE_TARGET"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
          # Windows output lives outside the workspace; cache its downloads only.
          cache-targets: ${{ runner.os != 'Windows' }}
      - name: Build and package
        run: |
          case "$NATIVE_TARGET" in
            *android*)
              ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              export PATH="$ndk_bin:$PATH"
              key=${NATIVE_TARGET//-/_}
              clang_target=${NATIVE_TARGET/armv7-/armv7a-}
              export "CC_$key=$ndk_bin/${clang_target}24-clang"
              export "CXX_$key=$ndk_bin/${clang_target}24-clang++"
              export "AR_$key=$ndk_bin/llvm-ar"
              export "RANLIB_$key=$ndk_bin/llvm-ranlib"
              export "CARGO_TARGET_$(echo "$key" | tr '[:lower:]' '[:upper:]')_LINKER=$ndk_bin/${clang_target}24-clang"
              export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'
              ;;
            *apple*)
              export RUSTFLAGS='-C link-arg=-Wl,-install_name,@rpath/libtor_ffi_plugin.dylib'
              case "$NATIVE_TARGET" in
                aarch64-apple-ios) SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path) ;;
                *-ios*) SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path) ;;
              esac
              export SDKROOT
              ;;
          esac
          cargo build --locked --release --lib --manifest-path rust/Cargo.toml \
            --target "$NATIVE_TARGET"
          case "$NATIVE_TARGET" in
            *windows*) library=tor_ffi_plugin.dll ;;
            *apple*) library=libtor_ffi_plugin.dylib ;;
            *) library=libtor_ffi_plugin.so ;;
          esac
          mkdir -p artifacts
          cp "$CARGO_TARGET_DIR/$NATIVE_TARGET/release/$library" "artifacts/$NATIVE_TARGET-$library"
      - name: Test platform time limits
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path rust/Cargo.toml --target "$NATIVE_TARGET" --test saturating_time
      - name: Smoke test desktop library
        if: ${{ !contains(matrix.target, 'android') && !contains(matrix.target, '-ios') }}
        run: |
          python - <<'PY'
          import ctypes
          from pathlib import Path
          library = ctypes.CDLL(str(next(Path('artifacts').iterdir()).resolve()))
          library.tor_proxy_stop.argtypes = [ctypes.c_void_p]
          library.tor_proxy_stop.restype = None
          library.tor_proxy_stop(None)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuilt-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  package:
    if: github.event_name == 'pull_request'
    name: Package example (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, runner: ubuntu-22.04}
          - {platform: android, runner: ubuntu-22.04}
          - {platform: ios, runner: macos-15}
          - {platform: macos, runner: macos-15}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config perl
      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          case "${{ matrix.platform }}" in
            linux) rustup target add x86_64-unknown-linux-gnu --toolchain "$toolchain" ;;
            android) rustup target add aarch64-linux-android --toolchain "$toolchain" ;;
            ios) rustup target add aarch64-apple-ios --toolchain "$toolchain" ;;
            macos) rustup target add aarch64-apple-darwin --toolchain "$toolchain" ;;
          esac
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: package-${{ matrix.platform }}
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Build packaged example
        working-directory: example
        run: |
          case "${{ matrix.platform }}" in
            linux) flutter build linux --release ;;
            android) flutter build apk --release --target-platform android-arm64 ;;
            ios) flutter build ios --release --no-codesign ;;
            macos) flutter build macos --release ;;
          esac
      - name: Load packaged macOS library
        if: matrix.platform == 'macos'
        run: |
          library=$(find example/build/macos/Build/Products/Release -type f -name libtor_ffi_plugin.dylib -print -quit)
          test -n "$library"
          nm -gj "$library" | grep -Fx _tor_proxy_stop
          LIBRARY="$library" python3 - <<'PY'
          import ctypes
          import os

          library = ctypes.CDLL(os.path.abspath(os.environ['LIBRARY']))
          library.tor_proxy_stop.argtypes = [ctypes.c_void_p]
          library.tor_proxy_stop.restype = None
          library.tor_proxy_stop(None)
          PY

  release:
    if: github.event_name != 'pull_request' && github.event.deleted != true
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prebuilt-*
          path: artifacts
          merge-multiple: true
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate manifest
        run: dart --packages=.dart_tool/package_config.json tool/prebuilt_manifest.dart artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release
          path: artifacts/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/native-')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^native-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          read -r manifest_pin _ < artifacts/manifest.sha256
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Native libraries built from $GITHUB_SHA. Use the matching package revision.

          Add to your app's root pubspec.yaml:

              hooks:
                user_defines:
                  tor_ffi_plugin:
                    native_build: prebuilt
                    prebuilt_manifest_url: "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json"
                    prebuilt_manifest_sha256: "$manifest_pin"

          See README.md for supported platforms and deployment minimums.
          EOF
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --latest=false \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
