name: Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v1

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.1'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Analyze Dart project source
        run: flutter analyze

      # Pure Dart; needs neither the native library nor a Tor network.
      - name: Run SOCKS socket tests
        run: flutter test test/socks_socket_test.dart

#      - name: Run Dart tests
#        run: flutter test
